[workspace]
resolver = "2"
members = [
    "products/nanoRUNTIME/nanortime-core",
    "products/nanoRUNTIME/nanortime-ffi",
    "products/nanoRUNTIME/nanortime-cli",
    "products/nanoRUNTIME/nanortime-web",
]

[patch.crates-io]
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2-mtp" }
llama-cpp-2 = { path = "vendor/llama-cpp-2" }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NanoAI Team"]
license = "MIT"
repository = "https://github.com/nanoai/nanortime"
description = "NanoAI Runtime — Motor de orquestación de IA híbrido (Edge-Cloud)"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Vector database (LanceDB Rust client)
lancedb = "0.4"

# Pin chrono to avoid arrow-arith v51 trait collision
chrono = "=0.4.38"

# Regex for PII detection
regex = "1.10"

# Config
toml = "0.8"

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Random number generation (for temperature sampling)
rand = "0.8"

# System information (real memory stats)
sysinfo = "0.31"

# JNI bindings for Android
jni = { version = "0.21", features = ["invocation"] }

[workspace.metadata]
rust-version = "1.75"
