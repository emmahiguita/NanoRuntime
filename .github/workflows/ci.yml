name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/nanoMOBILE/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: products/nanoMOBILE/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test

  format:
    name: Dart Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/nanoMOBILE/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
      - run: dart format --output=none --set-exit-if-changed lib/ test/

  # ── Rust CI ──────────────────────────────────────────────

  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --all -- --check

  # NOTA: no usar `--all-features` en jobs Rust. El vendor llama-cpp-sys-2
  # expone features que requieren SDKs externos ausentes en runners y en
  # builds de produccion (vulkan -> VULKAN_SDK, system-ggml -> find_package(ggml),
  # cuda -> nvcc). `--all-features` activa configuraciones que el producto nunca
  # soporta simultaneamente. El CI valida SOLO el contrato de produccion
  # declarado abajo.

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # --no-deps: el vendor llama-cpp-2 (path-dep) emite warnings propios
      # (unused imports); -D warnings no debe arrastrarlo.
      - run: cargo clippy --all-targets --no-deps -- -D warnings
      - run: cargo clippy -p nanortime-core --features simulated --no-deps -- -D warnings
      - run: cargo clippy -p nanortime-core --features mmap-streaming --no-deps -- -D warnings
      - run: cargo clippy -p nanortime-ffi --features android-jni,mmap-streaming --no-deps -- -D warnings

  rust-test:
    name: Rust Test (matriz de produccion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # Contrato de produccion: default (host), simulated (QA sin modelo),
      # mmap-streaming (streaming > RAM, OPPO) y wrapper JNI (Android).
      - run: cargo test -p nanortime-core
      - run: cargo test -p nanortime-core --features simulated
      - run: cargo test -p nanortime-core --features mmap-streaming
      - run: cargo check -p nanortime-ffi --features android-jni,mmap-streaming

  rust-build:
    name: Rust Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --release -p nanortime-cli

  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
