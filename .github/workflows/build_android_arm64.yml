name: Build NanoRuntime ARM64

# Compila llama.cpp con CacheAwareLoader para Android ARM64.
# Produce binario CPU con streaming de capas + Vulkan GPU.
# Sin Rust staticlib — stub C inline de 3 KB.

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: "27.0.12077973"
          cmake-version: "3.22.1"

      - name: Locate NDK toolchain
        id: ndk
        run: |
          # Find android.toolchain.cmake — try common paths
          TOOLCHAIN=""
          for dir in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "$HOME/android-sdk" /usr/local/lib/android/sdk; do
            if [ -d "$dir/ndk" ]; then
              # Pick the first NDK version available
              NDK_VER=$(ls "$dir/ndk" | head -1)
              CANDIDATE="$dir/ndk/$NDK_VER/build/cmake/android.toolchain.cmake"
              if [ -f "$CANDIDATE" ]; then
                TOOLCHAIN="$CANDIDATE"
                break
              fi
            fi
          done
          if [ -z "$TOOLCHAIN" ]; then
            echo "ERROR: Could not find android.toolchain.cmake"
            echo "SDK root: $ANDROID_SDK_ROOT"
            ls -R "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "no ndk dir"
            exit 1
          fi
          echo "toolchain=$TOOLCHAIN" >> $GITHUB_OUTPUT
          echo "Using NDK toolchain: $TOOLCHAIN"

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libvulkan-dev 2>/dev/null

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch master \
            https://github.com/ggerganov/llama.cpp.git llama.cpp-source

      - name: Copy NanoRuntime sources
        run: |
          cp nanortime-core/include/nanortime_streaming.h       llama.cpp-source/src/
          cp nanortime-core/include/nanortime_streaming_stub.c  llama.cpp-source/src/
          cp nanortime-core/include/nanortime_streaming_patch.h llama.cpp-source/src/

      - name: Patch decode loop
        run: |
          cd llama.cpp-source
          python3 ../scripts/patch_llamacpp_streaming.py src/llama-context.cpp
          # Verify patch was applied
          if ! grep -q "NANORTIME_STREAMING" src/llama-context.cpp; then
            echo "ERROR: Patch not applied!"
            exit 1
          fi
          echo "Patch verified"

      - name: Add streaming stub to build
        run: |
          # Append stub source to llama library CMake target
          echo "target_sources(llama PRIVATE src/nanortime_streaming_stub.c)" \
            >> llama.cpp-source/src/CMakeLists.txt

      - name: Configure CMake (CPU + Streaming)
        if: matrix.backend == 'cpu'
        run: |
          cd llama.cpp-source
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.toolchain }}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DNANORTIME_STREAMING" \
            -DCMAKE_CXX_FLAGS="-DNANORTIME_STREAMING"

      - name: Configure CMake (Vulkan GPU)
        if: matrix.backend == 'vulkan'
        run: |
          cd llama.cpp-source
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.toolchain }}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_VALIDATION=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd llama.cpp-source
          cmake --build build --parallel $(nproc)

      - name: Package binaries
        run: |
          mkdir -p artifact
          cd llama.cpp-source/build/bin
          tar -czf ../../../artifact/nanortime-${{ matrix.backend }}-arm64.tar.gz . 2>/dev/null || \
          tar -czf ../../../artifact/nanortime-${{ matrix.backend }}-arm64.tar.gz \
            --directory=../../../llama.cpp-source/build/bin .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanortime-${{ matrix.backend }}-arm64
          path: artifact/nanortime-${{ matrix.backend }}-arm64.tar.gz
