name: Build NanoRuntime ARM64

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Download Android NDK
        run: |
          # Use NDK r27c — stable, well-tested
          NDK_ZIP="android-ndk-r27c-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q "$NDK_ZIP" -d /tmp
          echo "ANDROID_NDK=/tmp/android-ndk-r27c" >> $GITHUB_ENV
          echo "NDK installed at /tmp/android-ndk-r27c"

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 --branch master \
            https://github.com/ggerganov/llama.cpp.git llama.cpp-source

      - name: Copy NanoRuntime sources
        run: |
          cp nanortime-core/include/nanortime_streaming.h       llama.cpp-source/src/
          cp nanortime-core/include/nanortime_streaming_stub.c  llama.cpp-source/src/

      - name: Patch decode loop
        run: |
          cd llama.cpp-source
          python3 ../scripts/patch_llamacpp_streaming.py src/llama-context.cpp
          grep -q "NANORTIME_STREAMING" src/llama-context.cpp || {
            echo "ERROR: Patch failed"
            exit 1
          }
          echo "Patch OK"

      - name: Add stub to CMake
        run: |
          echo "target_sources(llama PRIVATE nanortime_streaming_stub.c)" \
            >> llama.cpp-source/src/CMakeLists.txt

      - name: Configure CMake (CPU + Streaming)
        if: matrix.backend == 'cpu'
        run: |
          TOOLCHAIN="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          cd llama.cpp-source
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DNANORTIME_STREAMING" \
            -DCMAKE_CXX_FLAGS="-DNANORTIME_STREAMING"

      - name: Configure CMake (Vulkan GPU)
        if: matrix.backend == 'vulkan'
        run: |
          sudo apt-get install -y -qq libvulkan-dev 2>/dev/null || true
          TOOLCHAIN="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          cd llama.cpp-source
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_VALIDATION=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd llama.cpp-source
          cmake --build build --parallel $(nproc)

      - name: Package
        run: |
          mkdir -p artifact
          cd llama.cpp-source/build/bin
          tar -czf ../../../artifact/nanortime-${{ matrix.backend }}-arm64.tar.gz . 2>/dev/null || \
          tar -czf ../../../artifact/nanortime-${{ matrix.backend }}-arm64.tar.gz \
            --directory=../../../llama.cpp-source/build/bin .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nanortime-${{ matrix.backend }}-arm64
          path: artifact/nanortime-${{ matrix.backend }}-arm64.tar.gz
