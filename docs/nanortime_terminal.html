<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NanoRuntime — Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e14;color:#cdd6f4;font-family:'JetBrains Mono','Cascadia Code','Fira Code',monospace;height:100vh;display:flex;flex-direction:column}
.header{background:#111820;padding:10px 16px;font-size:12px;display:flex;justify-content:space-between;border-bottom:1px solid #1e2a38}
.header .dev{color:#58A6FF}
.header .stats{color:#6c7a8d;font-size:11px}
.output{flex:1;overflow-y:auto;padding:12px 16px;font-size:13px;line-height:1.6}
.output .prompt{color:#F78166;margin-top:12px}
.output .response{color:#cdd6f4;white-space:pre-wrap;word-break:break-word}
.output .meta{color:#484f58;font-size:11px;margin-top:4px;margin-bottom:8px}
.output .streaming{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.input-bar{display:flex;padding:10px 16px;background:#111820;border-top:1px solid #1e2a38}
.input-bar input{flex:1;background:#0d1117;border:1px solid#21262d;color:#cdd6f4;padding:10px 14px;font-size:14px;border-radius:6px;outline:none;font-family:inherit}
.input-bar input:focus{border-color:#58A6FF}
.input-bar button{background:#238636;color:white;border:none;padding:10px 20px;margin-left:8px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.input-bar button:hover{background:#2ea043}
.input-bar button:disabled{background:#21262d;color:#484f58;cursor:default}
.cursor{display:inline-block;width:8px;height:14px;background:#58A6FF;animation:blink 1s infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>

<div class="header">
  <span>🧠 <span class="dev">NanoRuntime Terminal</span></span>
  <span class="stats" id="stats">RAM: -- | ctx: -- | tok/s: --</span>
</div>

<div class="output" id="output">
  <div class="meta">NanoRuntime v1.2 — Samsung Galaxy A30s (3.72 GB) — Qwen 1.5B Q4_K_M</div>
  <div class="meta">Type a question. Press Enter or click Send.</div>
</div>

<div class="input-bar">
  <input type="text" id="prompt" placeholder="Ask anything..." autofocus>
  <button id="sendBtn" onclick="sendPrompt()">Send</button>
</div>

<script>
// WebSocket connection (replace with your daemon address)
const WS_URL = 'ws://localhost:9001';
let ws = null;
let currentResponse = null;
let isConnected = false;

function connect() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => { isConnected = true; updateStats('Connected'); };
    ws.onmessage = (e) => handleStreamEvent(JSON.parse(e.data));
    ws.onclose = () => { isConnected = false; updateStats('Disconnected'); setTimeout(connect, 2000); };
    ws.onerror = () => { isConnected = false; };
  } catch(e) {
    // WebSocket not available — use simulated streaming
    updateStats('Offline mode');
  }
}

function updateStats(status) {
  document.getElementById('stats').textContent = status;
}

// ── Simulated streaming (when no daemon is connected) ──────────────

const SIMULATED_RESPONSES = {
  'hello': 'Hello! I am NanoRuntime, running locally on this device.\n\nHow can I help you today?',
  'what is nanoruntime': 'NanoRuntime is a lightweight inference runtime that enables large language models to run on Android devices without crashing due to memory limits.\n\nIt uses dynamic memory paging and graceful degradation to prevent OOM (Out of Memory) errors.',
  'explain quantum': 'Quantum computing uses quantum-mechanical phenomena like superposition and entanglement to perform computations.\n\nUnlike classical bits (0 or 1), quantum bits (qubits) can exist in multiple states simultaneously, enabling certain calculations to be performed exponentially faster.',
  'python function': 'def binary_search(arr, target):\n    left, right = 0, len(arr) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if arr[mid] == target: return mid\n        elif arr[mid] < target: left = mid + 1\n        else: right = mid - 1\n    return -1',
  'default': 'I am processing your request locally on this device.\n\nFeel free to ask about technology, programming, science, or any topic — I will respond based on the model running on this hardware.'
};

async function sendPrompt() {
  const input = document.getElementById('prompt');
  const prompt = input.value.trim();
  if (!prompt) return;

  input.value = '';
  input.disabled = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('prompt', '> ' + prompt);

  // Check if daemon is connected
  if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ prompt, max_tokens: 150 }));
  } else {
    // Simulated streaming mode
    await simulateStreaming(prompt);
  }

  input.disabled = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

async function simulateStreaming(prompt) {
  const container = addMessage('response', '');
  const lower = prompt.toLowerCase();
  
  let text = SIMULATED_RESPONSES['default'];
  for (const [key, val] of Object.entries(SIMULATED_RESPONSES)) {
    if (key !== 'default' && lower.includes(key)) {
      text = val;
      break;
    }
  }

  // Stream character by character
  for (let i = 0; i < text.length; i++) {
    container.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
    await sleep(15 + Math.random() * 25);
  }

  container.innerHTML = text;
  addMessage('meta', `[Done: ${text.split(' ').length} words]`);
}

function addMessage(type, text) {
  const output = document.getElementById('output');
  const div = document.createElement('div');
  div.className = type;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
  return div;
}

function handleStreamEvent(event) {
  if (!currentResponse) {
    currentResponse = addMessage('response', '');
  }
  if (event.type === 'token') {
    currentResponse.textContent += event.text;
  } else if (event.type === 'done') {
    currentResponse = null;
    addMessage('meta', `[Done: ${event.tokens} tokens, conf: ${event.confidence.toFixed(2)}]`);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Init ───────────────────────────────────────────────────────────

connect();
document.getElementById('prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendPrompt();
});

// Demo: auto-type a welcome message
setTimeout(() => {
  if (!isConnected) {
    addMessage('meta', '[Offline mode — responses are simulated. Connect daemon for real inference.]');
  }
}, 1000);
</script>
</body>
</html>
