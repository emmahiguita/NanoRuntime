<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NanoRuntime — Chat local</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10161f;--line:#243143;--text:#e8edf5;--muted:#8b99ab;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--amber:#d29922}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% -20%,#162235 0,var(--bg) 46%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,textarea{font:inherit}button{cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(16,22,31,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#1f6feb,#58a6ff);font-size:18px;box-shadow:0 8px 30px rgba(31,111,235,.28)}
.brand-copy{min-width:0}.brand-title{font-weight:720;letter-spacing:-.02em}.model-name{max-width:48vw;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(210,153,34,.12)}
.status.ready .dot{background:var(--green);box-shadow:0 0 0 4px rgba(63,185,80,.12)}.status.error .dot,.status.offline .dot{background:var(--red);box-shadow:0 0 0 4px rgba(248,81,73,.12)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px 10px}.ghost:hover{border-color:#3a4b61;color:var(--text)}.ghost:disabled{opacity:.45;cursor:default}
.messages{overflow-y:auto;padding:28px max(18px,calc((100vw - 860px)/2));scroll-behavior:smooth}.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted);padding:24px}.empty strong{display:block;color:var(--text);font-size:22px;margin-bottom:8px}
.message{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 20px}.message.user{align-items:flex-end}.bubble{max-width:min(760px,88%);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.58;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.user .bubble{background:#17345d;border-color:#28528a;border-bottom-right-radius:5px}.assistant .bubble{border-bottom-left-radius:5px}.error .bubble{background:#2b171a;border-color:#6e292d;color:#ffb4b0}.pending .bubble{color:var(--muted)}
.pending .bubble::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite}.meta{margin:6px 5px 0;color:#68778a;font-size:11px}@keyframes pulse{50%{opacity:.2;transform:scale(.72)}}
.composer-wrap{padding:12px max(14px,calc((100vw - 900px)/2)) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(8,11,16,.98) 25%)}.composer{display:flex;align-items:flex-end;gap:10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
textarea{flex:1;min-height:42px;max-height:160px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 11px;line-height:1.45}textarea::placeholder{color:#68778a}.send{min-width:82px;height:42px;border:0;border-radius:11px;background:var(--blue);color:#07111f;font-weight:750}.send:hover{filter:brightness(1.08)}.send:disabled{background:#263448;color:#65758a;cursor:default}.hint{padding:7px 4px 0;text-align:center;color:#607086;font-size:11px}
@media(max-width:640px){.topbar{padding:10px 12px;gap:9px}.model-name{max-width:38vw}.status-label{display:none}.messages{padding:20px 12px}.bubble{max-width:94%}.ghost{padding:7px 8px}.composer-wrap{padding-left:8px;padding-right:8px}.send{min-width:68px}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="logo" aria-hidden="true">N</div><div class="brand-copy"><div class="brand-title">NanoRuntime</div><div class="model-name" id="modelName">Comprobando modelo…</div></div></div>
    <div class="status" id="connectionStatus" title="Comprobando conexión"><span class="dot" aria-hidden="true"></span><span class="status-label" id="statusLabel">Conectando…</span></div>
    <button class="ghost" id="clearBtn" type="button">Nuevo chat</button>
  </header>
  <section class="messages" id="messages" aria-live="polite"><div class="empty" id="emptyState"><div><strong>Chat local y privado</strong>Los mensajes se envían únicamente al modelo GGUF configurado en este equipo.</div></div></section>
  <footer class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" maxlength="12000" placeholder="Escribe un mensaje…" aria-label="Mensaje"></textarea><button class="send" id="sendBtn" type="button">Enviar</button></div><div class="hint">Enter para enviar · Shift + Enter para una nueva línea</div></footer>
</main>
<script>
const elements = {
  messages: document.getElementById('messages'), empty: document.getElementById('emptyState'),
  prompt: document.getElementById('prompt'), send: document.getElementById('sendBtn'),
  clear: document.getElementById('clearBtn'), status: document.getElementById('connectionStatus'),
  statusLabel: document.getElementById('statusLabel'), modelName: document.getElementById('modelName'),
};
const chat = { history: [], sessionId: createSessionId(), sending: false };

function createSessionId() {
  return globalThis.crypto?.randomUUID?.() ?? `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}
function modelBasename(path) { return String(path || 'Modelo no configurado').split(/[\\/]/).pop(); }
function setConnection(kind, label, detail = '') {
  elements.status.className = `status ${kind}`;
  elements.statusLabel.textContent = label;
  elements.status.title = detail || label;
}
async function refreshStatus() {
  try {
    const response = await fetch('/api/status', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    elements.modelName.textContent = modelBasename(data.model);
    const states = {
      configured: ['loading', 'Modelo configurado'], loading: ['loading', 'Cargando modelo…'],
      ready: ['ready', 'Modelo conectado'], missing: ['error', 'GGUF no encontrado'], error: ['error', 'Error del modelo'],
    };
    const [kind, label] = states[data.model_status] || ['loading', 'Servidor activo'];
    setConnection(kind, label, data.model_error || data.message);
  } catch (error) {
    elements.modelName.textContent = 'Servidor sin conexión';
    setConnection('offline', 'Desconectado', error.message);
  }
}
function addMessage(role, text, metaText = '') {
  elements.empty?.remove(); elements.empty = null;
  const article = document.createElement('article'); article.className = `message ${role}`;
  const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
  const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = metaText;
  article.append(bubble, meta); elements.messages.appendChild(article);
  elements.messages.scrollTop = elements.messages.scrollHeight;
  return { article, bubble, meta };
}
function setBusy(busy) {
  chat.sending = busy; elements.prompt.disabled = busy; elements.send.disabled = busy; elements.clear.disabled = busy;
  elements.send.textContent = busy ? 'Pensando…' : 'Enviar';
}
function resizePrompt() {
  elements.prompt.style.height = 'auto'; elements.prompt.style.height = `${Math.min(elements.prompt.scrollHeight, 160)}px`;
}
async function sendPrompt() {
  if (chat.sending) return;
  const prompt = elements.prompt.value.trim(); if (!prompt) return;
  const requestHistory = chat.history.slice(-24);
  addMessage('user', prompt, 'Tú'); elements.prompt.value = ''; resizePrompt(); setBusy(true);
  const pending = addMessage('assistant pending', 'Procesando con el modelo local…', 'NanoRuntime');
  try {
    const response = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, max_tokens: 512, history: requestHistory, session_id: chat.sessionId }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.response || `El runtime respondió HTTP ${response.status}`);
    if (!data.response?.trim()) throw new Error('El modelo devolvió una respuesta vacía');
    pending.article.className = 'message assistant'; pending.bubble.textContent = data.response;
    const speed = Number(data.tok_s || 0);
    const speedLabel = speed > 0 ? `${speed.toFixed(2)} tok/s` : 'velocidad no reportada';
    pending.meta.textContent = `NanoRuntime · ${speedLabel} · confianza ${Number(data.confidence || 0).toFixed(2)}`;
    chat.history.push({ role: 'user', content: prompt }, { role: 'assistant', content: data.response });
  } catch (error) {
    pending.article.className = 'message error'; pending.bubble.textContent = error.message || 'No se pudo conectar con NanoRuntime';
    pending.meta.textContent = 'La respuesta no fue simulada';
  } finally {
    setBusy(false); elements.prompt.focus(); refreshStatus();
  }
}
function clearConversation() {
  if (chat.sending) return;
  chat.history.length = 0; chat.sessionId = createSessionId(); elements.messages.replaceChildren();
  const empty = document.createElement('div'); empty.className = 'empty'; empty.id = 'emptyState';
  empty.innerHTML = '<div><strong>Nueva conversación</strong>El contexto anterior fue descartado.</div>';
  elements.messages.appendChild(empty); elements.empty = empty; elements.prompt.focus();
}
elements.send.addEventListener('click', sendPrompt); elements.clear.addEventListener('click', clearConversation);
elements.prompt.addEventListener('input', resizePrompt);
elements.prompt.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendPrompt(); }
});
refreshStatus(); setInterval(refreshStatus, 3000); elements.prompt.focus();
</script>
</body>
</html>
