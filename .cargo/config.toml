# Cargo configuration for Multi-Platform Cross-Compilation (Android, Linux, macOS, Raspberry Pi)
#
# Este config del REPO es portable: solo contiene opciones validas en cualquier
# maquina. Las rutas de toolchain de maquina (Android NDK, ninja del SDK, CC/CXX/AR
# del NDK) viven en ~/.cargo/config.toml (config de USUARIO, no versionado) — ver
# .cargo/README.md. Asi el workspace compila limpio en Windows, Ubuntu/WSL y
# macOS sin heredar rutas de otro host.

# ── Android ARM64 ────────────────────────────────────────────────────────────
# ar/linker del NDK: definidos en ~/.cargo/config.toml del usuario (rutas de maquina).
[target.aarch64-linux-android]
rustflags = ["-C", "target-feature=+neon,+dotprod,+fp16"]

# ── Android ARMv7 / x86_64 ───────────────────────────────────────────────────
# ar/linker: en ~/.cargo/config.toml del usuario.
[target.armv7-linux-androideabi]

[target.x86_64-linux-android]

# ── Linux (Ubuntu/Debian desktop) ────────────────────────────────────────────
# Sin env heredado: usa gcc/clang del sistema. Requiere build-essential.
[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

# ── Raspberry Pi / ARM64 Linux ───────────────────────────────────────────────
# Solo linker: el cross-build necesita CMAKE_TOOLCHAIN_FILE propio (ver build.rs
# de llama-cpp-sys-2, que solo define toolchain para Android).
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"