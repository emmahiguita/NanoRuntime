[package]
name = "nanortime-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NanoAI FFI bridge — Rust bindings for llama.cpp inference"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]  # Compila llama.cpp con backend CUDA (ggml-cuda.cu vía nvcc + find_cuda_helper)
mmap-streaming = ["llama-cpp-2/mmap-streaming"]  # Peso mmap-friendly (sin repack anon-RAM) para streaming > RAM
android-jni = ["dep:jni"]    # JNI bridge for Android NanoRuntimeBridge.kt

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
encoding_rs = "0.8"
rand = { workspace = true }

# Real llama.cpp bindings via llama-cpp-2
llama-cpp-2 = { version = "0.1.153" }

# JNI bindings (Android only, feature-gated)
jni = { workspace = true, optional = true }

[build-dependencies]
cmake = "0.1"
cc = "1.0"

[lib]
name = "nanortime_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[example]]
name = "test_batch"
path = "examples/test_batch.rs"
