[package]
name = "nanortime-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NanoAI Runtime core — orchestrator, execution, and inference layers"

[features]
default = []
simulated = []  # Use simulated backend for testing without real model
lancedb = ["dep:lancedb"]
unstable = []   # Duerme módulos del control plane que esperan hooks de llama.cpp inexistentes (mmap pointer, atención por capa, NGRAM, perplejidad de referencia). Sin estos hooks, conectarlos sería simulación. Ver src/memory_engine/mod.rs para el estado de conexión.
mmap-streaming = ["nanortime-ffi/mmap-streaming"]  # Peso mmap-friendly (sin repack anon-RAM) para modelos > RAM
static-stdcxx = ["nanortime-ffi/static-stdcxx"]  # libc++ estático para Android (sin libc++_shared.so)

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tempfile = "3"
lancedb = { workspace = true, optional = true }

# Real system memory stats
sysinfo = { workspace = true }

# FFI bridge to llama.cpp
nanortime-ffi = { path = "../nanortime-ffi" }
libc = "0.2.189"
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory", "Win32_System_SystemInformation"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }

# Directo para probes/ejemplos (mtp_probe, ...) que necesitan la API cruda
llama-cpp-2 = { path = "../../../vendor/llama-cpp-2" }
llama-cpp-sys-2 = { path = "../../../vendor/llama-cpp-sys-2-mtp" }
encoding_rs = "0.8"

# Benchmarks disabled — files not yet ported. Re-enable when ready.
# [[bench]]
# name = "router_benchmark"
# harness = false
# [[bench]]
# name = "benchmark_ram"
# harness = false

[[example]]
name = "validate"
path = "examples/validate.rs"

[[example]]
name = "runtime_probe"
path = "examples/runtime_probe.rs"

[[example]]
name = "verify_real"
path = "examples/verify_real.rs"

[[example]]
name = "gguf_probe"
path = "examples/gguf_probe.rs"

[[example]]
name = "load_unload_gate"
path = "examples/load_unload_gate.rs"

[[example]]
name = "sweep_analyze"
path = "examples/sweep_analyze.rs"
