name: nanoai
description: NanoAI — Local LLM Engine Observer. Flutter Material3 professional design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: 2.3.2
  http: ^1.2.2
  ffi: ^2.1.0
  crypto: ^3.0.7
  file_picker: ^11.0.3
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.2.2
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Requerido por integration_test/ (chat_engine_test, doom_stress_test,
  # full_app_test, offline_degradation_test, pty_real_test,
  # terminal_linux_test): sin la dep, analyze falla en 6 archivos.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# shared_preferences_android 2.4.x usa SharedPreferencesPlugin (Pigeon async,
# clase ListEncoder en MessagesAsync.g.kt) que no se dexa en el APK →
# ClassNotFoundException que aborta el GeneratedPluginRegistrant y rompe el
# registro de TODOS los plugins (file_picker, url_launcher, share_plus,
# persistencia). Se fija android a 2.2.4 (implementación sync, sin Pigeon async
# ni ListEncoder). platform_interface 2.4.2 conserva ambas APIs (sync+async),
# así que linux/windows/foundation 2.4.x siguen resolviendo.
dependency_overrides:
  shared_preferences_android: 2.2.4

flutter:
  uses-material-design: true
  assets:
    - assets/bin/
    - assets/exe/
    - assets/config/
    - assets/terminal_campaign_1.png
    - assets/terminal_campaign_2.png
    - assets/terminal_campaign_3.png
    - assets/owl/blink/
    - assets/owl/fly/
    - assets/owl/idle/
    - assets/owl/sleep/
    - assets/owl/takeoff/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
