name: nanoai
description: NanoAI — Local LLM Engine Observer. Flutter Material3 professional design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  http: ^1.2.2
  ffi: ^2.1.0
  crypto: ^3.0.7
  file_picker: ^11.0.3
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.2.2
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Requerido por integration_test/ (chat_engine_test, doom_stress_test,
  # full_app_test, offline_degradation_test, pty_real_test,
  # terminal_linux_test): sin la dep, analyze falla en 6 archivos.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bin/
    - assets/exe/
    - assets/config/
    - assets/terminal_campaign_1.png
    - assets/terminal_campaign_2.png
    - assets/terminal_campaign_3.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
