name: Build iOS (NanoAI)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Compilar aplicación iOS (sin firma)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar como archivo .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r NanoAI.ipa Payload
          mv NanoAI.ipa ../NanoAI.ipa

      - name: Subir archivo IPA como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: NanoAI-iOS-IPA
          path: NanoAI.ipa
          retention-days: 7
